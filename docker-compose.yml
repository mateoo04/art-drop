services:
  postgres:
    image: postgres:16
    container_name: artdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artdrop}
      POSTGRES_USER: ${POSTGRES_USER:-artdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artdrop}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - artdrop_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artdrop} -d ${POSTGRES_DB:-artdrop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artdrop_pg_data:
